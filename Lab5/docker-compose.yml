services:
  mongo1:
    image: mongo:7
    hostname: mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo1-data:/data/db
      - ./init-replica.js:/scripts/init-replica.js:ro
    restart: unless-stopped
  mongo2:
    image: mongo:7
    hostname: mongo2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo2-data:/data/db
    restart: unless-stopped
  mongo3:
    image: mongo:7
    hostname: mongo3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo3-data:/data/db
    restart: unless-stopped
  api1:
    build: ./app
    hostname: api1
    environment: &mongo_env
      MONGO_URI: "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0"
    depends_on: [mongo1, mongo2, mongo3]
    restart: unless-stopped
  api2:
    build: ./app
    hostname: api2
    environment: *mongo_env
    depends_on: [mongo1, mongo2, mongo3]
    restart: unless-stopped
  api3:
    build: ./app
    hostname: api3
    environment: *mongo_env
    depends_on: [mongo1, mongo2, mongo3]
    restart: unless-stopped
  nginx:
    image: nginx:1.27
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api1, api2, api3]
    restart: unless-stopped
volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
